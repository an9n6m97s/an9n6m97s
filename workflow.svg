<path class="flow" d="M90 174H1310" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/>
<g class="m" font-size="15" fill="#C9E1FC" text-anchor="middle"><text x="122" y="230">DEFINE</text><text x="353" y="230">ARCHITECT</text><text x="584" y="230">BUILD</text><text x="816" y="230">SECURE</text><text x="1047" y="230">DEPLOY</text><text x="1274" y="230">ITERATE</text></g>
<g fill="#08172A" stroke="#61BCFF" stroke-width="3"><circle cx="122" cy="174" r="12"/><circle cx="353" cy="174" r="12"/><circle cx="584" cy="174" r="12"/><circle cx="816" cy="174" r="12"/><circle cx="1047" cy="174" r="12"/><circle cx="1274" cy="174" r="12"/></g><g fill="#A0DCFF"><circle cx="122" cy="174" r="4"/><circle cx="353" cy="174" r="4"/><circle cx="584" cy="174" r="4"/><circle cx="816" cy="174" r="4"/><circle cx="1047" cy="174" r="4"/><circle cx="1274" cy="174" r="4"/></g>
