<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-label="Lucian-Mihai Lupșă. Software systems, secure infrastructure, competitive robotics.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B15"/><stop offset=".56" stop-color="#0A152A"/><stop offset="1" stop-color="#040914"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".69" stop-color="#EDF6FF"/><stop offset="1" stop-color="#7EBDFF"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2981FF"/><stop offset="1" stop-color="#6EE7FF"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#1B71FF" stop-opacity=".29"/><stop offset="1" stop-color="#1B71FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7AA3D7" stroke-opacity=".065" stroke-width="1"/></pattern>
  <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#66A3EA" opacity=".18"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  <clipPath id="clip"><rect width="1400" height="510" rx="22"/></clipPath>
  <style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
  .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
  @keyframes pulsing {0%,100%{opacity:.36}50%{opacity:1}}
  @keyframes travel{0%{stroke-dashoffset:260}100%{stroke-dashoffset:0}}
  @keyframes orbit {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .pulse{animation:pulsing 3s ease-in-out infinite}
  .dash{stroke-dasharray:14 16;animation:travel 8s linear infinite}
  </style>
</defs>
